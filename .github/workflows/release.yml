name: Publish verified portable
on:
  workflow_run:
    workflows: ['Test', 'Package executable']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Test or Package executable run on the current main commit
        required: true
        type: string
      tag:
        description: Version tag matching that commit, such as v0.7.1
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-portable
  cancel-in-progress: false
jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Select an existing verified build
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/ci_release.py
      - name: Check out the verified commit
        if: steps.package.outputs.publish == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.package.outputs.sha }}
      - name: Download its Windows executable
        if: steps.package.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: SecurityLab-Windows-X64
          path: portable
          run-id: ${{ steps.package.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Assemble release archives
        if: steps.package.outputs.publish == 'true'
        run: python3 scripts/assemble_release.py
      - name: Publish portable release
        if: steps.package.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.package.outputs.sha }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" "release/SecurityLab-$RELEASE_TAG-Windows-x64.zip" "release/SecurityLab-$RELEASE_TAG-Windows-x64.exe" "release/SHA256SUMS-$RELEASE_TAG.txt" --target "$TARGET_SHA" --title "Security Lab $RELEASE_TAG" --notes-file docs/RELEASE.md --latest
