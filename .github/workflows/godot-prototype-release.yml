name: Publish prototype beta
on:
  push:
    branches: ['codex/godot-investigation-prototype']
    paths: ['.github/workflows/godot-prototype-release.yml']
permissions:
  contents: read
concurrency:
  group: prototype-beta-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PROTOTYPE_RUN_ID: '37500475383'
      PROTOTYPE_BUILD_SHA: '6ac0fc98cba127ca96c3ab1abbea58c79d52c33f'
      PROTOTYPE_VERSION: '0.1.1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish verified Windows files at the matching publication commit
        run: python scripts/prototype-release.py
