name: Publish verified beta
on:
  push:
    branches: ['beta']
    paths: ['.github/workflows/godot-prototype-release.yml']
permissions:
  contents: read
concurrency:
  group: prototype-beta-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/beta' && contains(github.event.head_commit.message, 'Publish verified SecurityLab-beta-')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PROTOTYPE_RUN_ID: '0'
      PROTOTYPE_BUILD_SHA: '0000000000000000000000000000000000000000'
      PROTOTYPE_VERSION: '0.3.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish verified Windows and Android files
        run: python scripts/prototype-release.py
