name: Publish verified beta
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful beta Windows and Android validation run ID
        required: true
        type: string
      build_sha:
        description: Full commit SHA verified by that run
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: prototype-beta-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PROTOTYPE_RUN_ID: ${{ inputs.run_id }}
      PROTOTYPE_BUILD_SHA: ${{ inputs.build_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read current version
        run: |
          python3 -c 'import json,os; f=open(os.environ["GITHUB_ENV"],"a"); f.write("PROTOTYPE_VERSION="+json.load(open("godot/prototype/version.json"))["version"]+"\n"); f.close()'
      - name: Publish verified Windows and Android files
        run: python3 scripts/prototype-release.py
