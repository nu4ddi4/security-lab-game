name: Test
on:
  workflow_call:
    inputs:
      force_runtime:
        type: boolean
        default: false
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    # Keep the protected main branch's required check name.
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Check test and release policy
        run: python3 -m unittest discover -s tests/ci
      - name: Select affected code
        id: scope
        env:
          FORCE_RUNTIME: ${{ inputs.force_runtime }}
        run: python3 scripts/ci_scope.py
      - name: Reuse successful checks for identical inputs
        if: steps.scope.outputs.runtime == 'true'
        id: verified
        uses: actions/cache@v4
        with:
          path: .cache/ci-verified
          key: quick-4.7.2-v1-${{ runner.os }}-${{ hashFiles('godot/**', 'scripts/ci-godot-test.py', 'scripts/prototype-test.py', 'scripts/release_version.py', '.github/actions/godot-setup/action.yml', '.github/workflows/ci.yml') }}
      - uses: ./.github/actions/godot-setup
        if: steps.scope.outputs.runtime == 'true' && steps.verified.outputs.cache-hit != 'true'
        with:
          export: 'false'
      - name: Investigation rules, saves, services and input
        if: steps.scope.outputs.runtime == 'true' && steps.verified.outputs.cache-hit != 'true'
        run: |
          python3 scripts/ci-godot-test.py --godot "$SECURITY_LAB_GODOT_CONSOLE"
          mkdir -p .cache/ci-verified
          echo "Godot 4.7.2: all quick checks passed" > .cache/ci-verified/passed.txt
