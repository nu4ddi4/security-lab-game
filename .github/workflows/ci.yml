name: Test
on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  # Keep PR checks independent of a push on its source branch.
  group: test-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      web: ${{ steps.scope.outputs.web }}
      godot: ${{ steps.scope.outputs.godot }}
      windows_web: ${{ steps.scope.outputs.windows_web }}
      windows_godot: ${{ steps.scope.outputs.windows_godot }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check CI selection and release safeguards
        run: python3 -m unittest discover -s tests/ci
      - name: Select affected runtimes
        id: scope
        run: python3 scripts/ci_scope.py
  web:
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: web-lfs-${{ hashFiles('assets/models/security_lab.glb') }}
      - name: Fetch runtime model
        run: git lfs pull --include="assets/models/security_lab.glb" --exclude=""
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Web unit and server checks
        run: npm test && npm run test:server
  godot:
    needs: scope
    if: needs.scope.outputs.godot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/godot-setup
        with:
          export: 'false'
      - name: Native rules and dummy investigation scene
        run: python3 scripts/ci-godot-test.py --godot "$SECURITY_LAB_GODOT_CONSOLE"
  windows_web:
    needs: [scope, web]
    if: needs.scope.outputs.windows_web == 'true'
    uses: ./.github/workflows/package.yml
  windows_godot:
    needs: [scope, godot]
    if: needs.scope.outputs.windows_godot == 'true'
    uses: ./.github/workflows/godot-native.yml
  test:
    # This stable required check also reports success on documentation-only PRs.
    if: always()
    needs: [scope, web, godot, windows_web, windows_godot]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Require all selected checks to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_scope.py --gate
