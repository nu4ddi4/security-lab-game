name: Investigation prototype Windows
on:
  workflow_dispatch:
  push:
    branches: ['codex/godot-investigation-prototype']
    paths: ['.github/workflows/godot-prototype.yml', 'godot/prototype/version.json']
permissions:
  contents: read
concurrency:
  group: prototype-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prototype:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/godot-setup
        with:
          export: 'true'
      - name: Read prototype version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content godot/prototype/version.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Export and check standalone prototype
        shell: pwsh
        run: |
          python scripts/prototype-build.py --rendered-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        id: artifact
        with:
          name: SecurityLab-proto-${{ steps.version.outputs.version }}-Windows-x64
          path: prototype-dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Download link
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          PROTOTYPE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          "[SecurityLab-proto-$env:PROTOTYPE_VERSION]($env:ARTIFACT_URL)" >> $env:GITHUB_STEP_SUMMARY
