name: Build, test and release
on:
  push:
    branches: [main, beta]
  workflow_dispatch:
    inputs:
      platforms:
        description: Validate both platforms or only the affected one
        type: choice
        options: [all, windows, android]
        default: all
      publish:
        description: Publish after successful validation (main/beta only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: prototype-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quick:
    uses: ./.github/workflows/ci.yml
    with:
      force_runtime: true
  version:
    needs: quick
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      published: ${{ steps.prepare.outputs.published }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      append_android: ${{ steps.prepare.outputs.append_android }}
    steps:
      - uses: actions/checkout@v4
      - name: Allocate release version
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare-release.py
  prototype:
    needs: [quick, version]
    if: needs.version.outputs.published != 'true' && (github.event_name == 'push' || inputs.platforms != 'android')
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SECURITY_LAB_RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the verified detailed office asset
        run: git lfs pull --include="godot/assets/models/*.glb" --exclude=""
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/godot-setup
        with:
          export: 'true'
      - name: Reuse the same verified Windows build
        id: windows_cache
        uses: actions/cache@v4
        with:
          path: prototype-dist
          key: release-windows-v2-4.7.2-${{ github.sha }}-${{ needs.version.outputs.version }}
      - name: Export and check standalone prototype
        if: steps.windows_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python scripts/prototype-build.py --rendered-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: ./.github/actions/inno-setup
      - name: Package the beta installer and verify updater behavior
        shell: pwsh
        run: |
          python scripts/beta-installer-build.py --iscc $env:SECURITY_LAB_ISCC
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Isolated saves are permitted only in dev; never relax production path checks.
          ./tests/native/security_windows_updater.ps1 -Beta -Iscc $env:SECURITY_LAB_ISCC -Results prototype-dist/beta-windows-updater.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/godot-update-network-test.py --godot $env:SECURITY_LAB_GODOT_CONSOLE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        id: artifact
        with:
          name: SecurityLab-${{ needs.version.outputs.version }}-Windows-x64
          path: |
            prototype-dist/*.exe
            prototype-dist/*.json
            prototype-dist/*.sha256
            prototype-dist/ui/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Download link
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          PROTOTYPE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          "[SecurityLab-$env:PROTOTYPE_VERSION]($env:ARTIFACT_URL)" >> $env:GITHUB_STEP_SUMMARY
  android:
    needs: [quick, version]
    if: (needs.version.outputs.published != 'true' || needs.version.outputs.append_android == 'true') && (github.event_name == 'push' || inputs.platforms != 'windows')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SECURITY_LAB_RELEASE_VERSION: ${{ needs.version.outputs.version }}
      SECURITY_LAB_RELEASE_SOURCE_SHA: ${{ needs.version.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the verified detailed office asset
        run: git lfs pull --include="godot/assets/models/*.glb" --exclude=""
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;35.0.1 platforms;android-35'
          log-accepted-android-sdk-licenses: 'false'
      - uses: ./.github/actions/godot-setup
        with:
          export: 'true'
      - name: Export signed APK and matching QA APK
        run: python3 scripts/prototype-android-build.py
      - name: Install screen verification dependency
        run: python3 -m pip install Pillow==11.3.0
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, play, update and relaunch on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          disk-size: 6G
          emulator-options: -no-window -gpu swangle -no-snapshot -wipe-data -partition-size 6144 -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 scripts/prototype-android-test.py
      - uses: actions/upload-artifact@v4
        with:
          name: SecurityLab-${{ needs.version.outputs.version }}-Android
          path: prototype-android-dist/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Retain Android review screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-android-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            prototype-android-dist/android-startup.png
            prototype-android-dist/android-smoke.json
            prototype-android-dist/android-log.txt
            prototype-android-dist/ui/*.png
          if-no-files-found: ignore
          retention-days: 14
  release:
    needs: [quick, version, prototype, android]
    if: >-
      always() && needs.quick.result == 'success' && needs.version.result == 'success' &&
      (github.event_name == 'push' || inputs.publish) &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') &&
      ((needs.version.outputs.published == 'true' &&
        (needs.version.outputs.append_android != 'true' || needs.android.result == 'success')) ||
       (needs.prototype.result == 'success' &&
        needs.android.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SECURITY_LAB_RELEASE_VERSION: ${{ needs.version.outputs.version }}
      SECURITY_LAB_RELEASE_SOURCE_SHA: ${{ needs.version.outputs.source_sha }}
      SECURITY_LAB_APPEND_ANDROID: ${{ needs.version.outputs.append_android }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified files and then update channel
        run: python3 scripts/prototype-release.py
