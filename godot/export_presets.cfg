[preset.0]
name="Windows Prototype"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="prototype/version.json,prototype/content/*.json,prototype/tests/*.json,prototype/build_info.json,resources/*.json,resources/*.ps1,assets/credits.txt,assets/fonts/OFL.txt,assets/fonts/Gaegu-OFL.txt,LICENSES.txt"
exclude_filter="prototype/tests/results/*,tests/results/*,builds/*"
export_path="../prototype-dist/SecurityLab.exe"
script_export_mode=2

[preset.0.options]
binary_format/embed_pck=true
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
